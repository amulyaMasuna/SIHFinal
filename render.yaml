services:
  # -------------------------------------------------------------
  # 1. Python AI Microservice (FastAPI + OpenCV Preprocessor)
  # -------------------------------------------------------------
  - type: web
    name: legal-metrology-ai-python
    env: python
    rootDir: backend-python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

  # -------------------------------------------------------------
  # 2. Node.js Express API Gateway (JWT Auth + Rules Engine)
  # -------------------------------------------------------------
  - type: web
    name: legal-metrology-node-gateway
    env: node
    rootDir: backend-node
    buildCommand: npm install
    startCommand: npm start
    plan: free
    region: oregon
    envVars:
      - key: JWT_SECRET
        value: legal_metrology_super_secret_jwt_key_2026
      - key: PYTHON_AI_URL
        value: https://legal-metrology-ai-python.onrender.com/api/v1/extract

  # -------------------------------------------------------------
  # 3. React.js PWA Frontend (Render Static Site)
  # -------------------------------------------------------------
  - type: web
    name: legal-metrology-frontend
    env: static
    rootDir: frontend-react
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://legal-metrology-node-gateway.onrender.com/api/v1
